name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CODE_REVIEWER }}
          # No track_progress here. It forces tag mode, whose toolset has no
          # inline-comment tool — and the prompt below asks for inline
          # comments. That mismatch failed the run on #35 with three
          # permission denials. A pull_request event auto-detects review mode,
          # which grants them.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against CLAUDE.md in the repo root, which is the
            source of truth for this project's conventions. Read it first.

            Weight the review toward the rules this codebase actually gets
            wrong, in this order:

            1. **Theming.** Content surfaces must never use literal
               white/black opacity utilities (`bg-white/7`, `text-white`,
               `rgba(255,255,255,...)`) — they do not flip with the theme.
               They take `ink`-opacity utilities or
               `rgb(var(--ink) / 0.07)`. Flag any raw hex in a component:
               every color resolves from a CSS variable in globals.css.
               `text-accent`/`text-danger` for bare text, `-fill` variants
               only where something sits on the fill.

            2. **Contrast.** Any new or changed color pairing needs its
               ratio checked against the surface it lands on — the page
               background, not a card. AA is 4.5:1 for text, 3:1 for UI
               boundaries. State the measured number. This repo has
               regressed on this before.

            3. **Scale tokens.** Z-index, radius, type, sizing, duration
               and easing are named in tailwind.config.ts. A bracket value
               that reinvents a scale step is a defect; a genuine one-off
               local measurement is not. Tailwind's opacity scale only
               steps in fives, so an unlisted step silently emits no CSS.

            4. **Motion.** Animate transform and opacity only — this app
               stacks backdrop-filter surfaces and animating width/height
               drops frames in WKWebView. Collapses use Collapse.tsx, not
               max-height. Press feedback needs a transition list that
               includes `transform`, or the `active:scale-*` does nothing.

            5. **Shared primitives.** Check SegmentedControl, ViewTransition,
               Collapse, Meter and AnimatedNumber were reached for before
               anything was hand-rolled.

            6. **Correctness.** Real bugs in the diff — wrong state, missing
               await, broken RLS assumptions, native paths not behind
               `isNative()`.

            If the PR changes web source under app/ or components/, check
            whether it also needs `npm run ios:sync` — without it the iOS
            build ships a stale bundle.

            Use inline comments for specific lines. Use one top-level
            comment for the summary. Be concrete: name the file, the rule,
            and the fix. Do not pad the review with praise or restate the
            diff. If the PR is clean, say so briefly and stop.

          # --allowedTools REPLACES the default allowlist, it does not extend
          # it. Listing only the comment tools left the run with no Read,
          # Grep or Glob, so it could not open CLAUDE.md and died in one turn
          # at $0. Everything the review needs has to be named here.
          claude_args: |
            --allowedTools "Read,Grep,Glob,LS,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
